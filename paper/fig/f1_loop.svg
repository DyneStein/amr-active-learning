<svg viewBox="0 0 980 352" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0,0.6 L6.4,3.5 L0,6.4 z" fill="#52514e"/></marker><marker id="arR" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0,0.6 L6.4,3.5 L0,6.4 z" fill="#e34948"/></marker><marker id="arA" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0,0.6 L6.4,3.5 L0,6.4 z" fill="#1baf7a"/></marker></defs><rect width="980" height="352" fill="#fcfcfb"/><rect x="14" y="108" width="118" height="62" rx="5" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="1"/><text x="73.0" y="132.6" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>New isolates</text><text x="73.0" y="143.6" text-anchor="middle" fill="#52514e" font-size="8.6">arrive during</text><text x="73.0" y="154.1" text-anchor="middle" fill="#52514e" font-size="8.6">the year (2017)</text><rect x="166" y="108" width="120" height="62" rx="5" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1"/><text x="226.0" y="132.6" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>Model in use</text><text x="226.0" y="143.6" text-anchor="middle" fill="#52514e" font-size="8.6">scores each one:</text><text x="226.0" y="154.1" text-anchor="middle" fill="#52514e" font-size="8.6">p = P(resistant)</text><rect x="320" y="108" width="132" height="62" rx="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="386.0" y="132.6" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>Selection rule</text><text x="386.0" y="143.6" text-anchor="middle" fill="#52514e" font-size="8.6">picks b of them</text><text x="386.0" y="154.1" text-anchor="middle" fill="#52514e" font-size="8.6">(the lab budget)</text><path d="M132,139 L164,139" stroke="#52514e" stroke-width="1.1" fill="none" marker-end="url(#ar)"/><path d="M286,139 L318,139" stroke="#52514e" stroke-width="1.1" fill="none" marker-end="url(#ar)"/><rect x="500" y="22" width="150" height="58" rx="5" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1"/><text x="575.0" y="44.6" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>Laboratory test</text><text x="575.0" y="55.6" text-anchor="middle" fill="#52514e" font-size="8.6">true S / R label</text><text x="575.0" y="66.1" text-anchor="middle" fill="#52514e" font-size="8.6">(slow, expensive)</text><path d="M452,124 C476,124 480,60 498,52" stroke="#1baf7a" stroke-width="1.1" fill="none" marker-end="url(#arA)"/><text x="468" y="92" text-anchor="middle" fill="#1baf7a" font-size="8.6" font-weight='bold'>tested</text><rect x="500" y="196" width="150" height="58" rx="5" fill="#fcfcfb" stroke="#e34948" stroke-width="1"/><text x="575.0" y="218.6" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>Model's call is used</text><text x="575.0" y="229.6" text-anchor="middle" fill="#52514e" font-size="8.6">for the patient:</text><text x="575.0" y="240.1" text-anchor="middle" fill="#52514e" font-size="8.6">resistant if p ≥ t</text><path d="M452,154 C476,154 480,218 498,226" stroke="#e34948" stroke-width="1.1" fill="none" marker-end="url(#arR)"/><text x="466" y="188" text-anchor="middle" fill="#e34948" font-size="8.6" font-weight='bold'>not tested</text><rect x="688" y="180" width="128" height="34" rx="5" fill="#fdecec" stroke="#e34948" stroke-width="1"/><text x="752.0" y="200.4" text-anchor="middle" fill="#0b0b0b" font-size="9.2" font-weight='bold'>Very major error</text><text x="752" y="209" text-anchor="middle" fill="#e34948" font-size="8.0">resistant called susceptible</text><rect x="688" y="228" width="128" height="34" rx="5" fill="#fdf4e1" stroke="#b9780a" stroke-width="1"/><text x="752.0" y="248.4" text-anchor="middle" fill="#0b0b0b" font-size="9.2" font-weight='bold'>Major error</text><text x="752" y="257" text-anchor="middle" fill="#8a5c08" font-size="8.0">susceptible called resistant</text><path d="M650,210 L686,201" stroke="#e34948" stroke-width="1.1" fill="none" marker-end="url(#arR)"/><path d="M650,232 L686,241" stroke="#b9780a" stroke-width="1.1" fill="none" marker-end="url(#ar)"/><rect x="700" y="22" width="126" height="58" rx="5" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1"/><text x="763.0" y="44.6" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>Retrain</text><text x="763.0" y="55.6" text-anchor="middle" fill="#52514e" font-size="8.6">model, threshold t</text><text x="763.0" y="66.1" text-anchor="middle" fill="#52514e" font-size="8.6">conformal bounds</text><path d="M650,51 L698,51" stroke="#1baf7a" stroke-width="1.1" fill="none" marker-end="url(#arA)"/><rect x="858" y="22" width="108" height="58" rx="5" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="1"/><text x="912.0" y="48.8" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>Next round</text><text x="912.0" y="59.8" text-anchor="middle" fill="#52514e" font-size="8.6">of arrivals</text><path d="M826,51 L856,51" stroke="#52514e" stroke-width="1.1" fill="none" marker-end="url(#ar)"/><path d="M912,80 C912,290 240,300 226,176" stroke="#52514e" stroke-width="1.1" fill="none" stroke-dasharray="5,3" marker-end="url(#ar)"/><text x="530" y="292" text-anchor="middle" fill="#8a8982" font-size="8.8" font-style='italic'>the updated model scores the next batch   ·   4 rounds per year</text><rect x="858" y="180" width="108" height="82" rx="5" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1"/><text x="912.0" y="210.4" text-anchor="middle" fill="#0b0b0b" font-size="9.6" font-weight='bold'>End of year</text><text x="912.0" y="221.4" text-anchor="middle" fill="#52514e" font-size="8.6">evaluate on</text><text x="912.0" y="231.9" text-anchor="middle" fill="#52514e" font-size="8.6">the next year’s</text><text x="912.0" y="242.4" text-anchor="middle" fill="#52514e" font-size="8.6">isolates (2018)</text><path d="M826,221 L856,221" stroke="#52514e" stroke-width="1.1" fill="none" marker-end="url(#ar)"/><text x="14" y="332" text-anchor="start" fill="#52514e" font-size="8.8">What the paper measures: model quality on 2018 (AUROC) and the errors made on untested isolates during the year.</text></svg>