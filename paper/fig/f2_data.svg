<svg viewBox="0 0 980 336" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0,0.6 L6.4,3.5 L0,6.4 z" fill="#52514e"/></marker><marker id="arR" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0,0.6 L6.4,3.5 L0,6.4 z" fill="#e34948"/></marker><marker id="arA" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0,0.6 L6.4,3.5 L0,6.4 z" fill="#1baf7a"/></marker></defs><rect width="980" height="336" fill="#fcfcfb"/><rect x="150" y="24" width="150" height="26" rx="4" fill="#4a3aa7" fill-opacity="0.12" stroke="#4a3aa7"/><text x="225.0" y="41" text-anchor="middle" fill="#4a3aa7" font-size="10" font-weight='bold'>2015–2016</text><text x="225.0" y="62" text-anchor="middle" fill="#52514e" font-size="8.4">train (80%) + validation (20%)</text><rect x="310" y="24" width="380" height="26" rx="4" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6"/><text x="500.0" y="41" text-anchor="middle" fill="#2a78d6" font-size="10" font-weight='bold'>2017</text><text x="500.0" y="62" text-anchor="middle" fill="#52514e" font-size="8.4">arrives in 4 rounds · the label budget is spent here</text><rect x="700" y="24" width="150" height="26" rx="4" fill="#0b0b0b" fill-opacity="0.12" stroke="#0b0b0b"/><text x="775.0" y="41" text-anchor="middle" fill="#0b0b0b" font-size="10" font-weight='bold'>2018</text><text x="775.0" y="62" text-anchor="middle" fill="#52514e" font-size="8.4">held out: the test year</text><rect x="320" y="72" width="84" height="15" rx="3" fill="#2a78d6" fill-opacity="0.18"/><text x="362" y="83" text-anchor="middle" fill="#1a5490" font-size="7.8">round 1</text><rect x="412" y="72" width="84" height="15" rx="3" fill="#2a78d6" fill-opacity="0.18"/><text x="454" y="83" text-anchor="middle" fill="#1a5490" font-size="7.8">round 2</text><rect x="504" y="72" width="84" height="15" rx="3" fill="#2a78d6" fill-opacity="0.18"/><text x="546" y="83" text-anchor="middle" fill="#1a5490" font-size="7.8">round 3</text><rect x="596" y="72" width="84" height="15" rx="3" fill="#2a78d6" fill-opacity="0.18"/><text x="638" y="83" text-anchor="middle" fill="#1a5490" font-size="7.8">round 4</text><text x="140" y="117" text-anchor="end" fill="#0b0b0b" font-size="9.2" font-weight='bold'>E. coli – ceftriaxone</text><rect x="150" y="100" width="150" height="26" rx="4" fill="#4a3aa7" fill-opacity="0.10" stroke="#4a3aa7" stroke-opacity="0.55"/><text x="225.0" y="117" text-anchor="middle" fill="#0b0b0b" font-size="9">1,481 isolates</text><rect x="310" y="100" width="380" height="26" rx="4" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-opacity="0.55"/><text x="500.0" y="117" text-anchor="middle" fill="#0b0b0b" font-size="9">2,094 isolates</text><rect x="700" y="100" width="150" height="26" rx="4" fill="#0b0b0b" fill-opacity="0.10" stroke="#0b0b0b" stroke-opacity="0.55"/><text x="775.0" y="117" text-anchor="middle" fill="#0b0b0b" font-size="9">1,386 isolates</text><text x="140" y="157" text-anchor="end" fill="#0b0b0b" font-size="9.2" font-weight='bold'>K. pneumoniae – ceftriaxone</text><rect x="150" y="140" width="150" height="26" rx="4" fill="#4a3aa7" fill-opacity="0.10" stroke="#4a3aa7" stroke-opacity="0.55"/><text x="225.0" y="157" text-anchor="middle" fill="#0b0b0b" font-size="9">812 isolates</text><rect x="310" y="140" width="380" height="26" rx="4" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-opacity="0.55"/><text x="500.0" y="157" text-anchor="middle" fill="#0b0b0b" font-size="9">1,273 isolates</text><rect x="700" y="140" width="150" height="26" rx="4" fill="#0b0b0b" fill-opacity="0.10" stroke="#0b0b0b" stroke-opacity="0.55"/><text x="775.0" y="157" text-anchor="middle" fill="#0b0b0b" font-size="9">775 isolates</text><text x="140" y="197" text-anchor="end" fill="#0b0b0b" font-size="9.2" font-weight='bold'>S. aureus – oxacillin</text><rect x="150" y="180" width="150" height="26" rx="4" fill="#4a3aa7" fill-opacity="0.10" stroke="#4a3aa7" stroke-opacity="0.55"/><text x="225.0" y="197" text-anchor="middle" fill="#0b0b0b" font-size="9">1,141 isolates</text><rect x="310" y="180" width="380" height="26" rx="4" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-opacity="0.55"/><text x="500.0" y="197" text-anchor="middle" fill="#0b0b0b" font-size="9">1,445 isolates</text><rect x="700" y="180" width="150" height="26" rx="4" fill="#0b0b0b" fill-opacity="0.10" stroke="#0b0b0b" stroke-opacity="0.55"/><text x="775.0" y="197" text-anchor="middle" fill="#0b0b0b" font-size="9">1,204 isolates</text><text x="140" y="222" text-anchor="end" fill="#8a8982" font-size="8.6" font-style='italic'>single hospital (DRIAMS-A)</text><rect x="150" y="236" width="690" height="62" rx="6" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-dasharray="4,3"/><text x="164" y="254" text-anchor="start" fill="#a8431a" font-size="8.8" font-weight='bold'>Cross-site: the 2015–16 model is moved to three other hospitals (2018 isolates), which buy their own labels</text><text x="164" y="272" text-anchor="start" fill="#2a78d6" font-size="8.6" font-weight='bold'>hospital B:</text><text x="220" y="272" text-anchor="start" fill="#52514e" font-size="8.6">213, 152, 346 isolates</text><text x="364" y="272" text-anchor="start" fill="#eb6834" font-size="8.6" font-weight='bold'>hospital C:</text><text x="420" y="272" text-anchor="start" fill="#52514e" font-size="8.6">916, 366, 738 isolates</text><text x="564" y="272" text-anchor="start" fill="#4a3aa7" font-size="8.6" font-weight='bold'>hospital D:</text><text x="620" y="272" text-anchor="start" fill="#52514e" font-size="8.6">1,994, 2,151 isolates</text><text x="164" y="288" text-anchor="start" fill="#8a8982" font-size="8.2" font-style='italic'>(S. aureus has no labelled isolates at hospital D, so that pair is not run there)</text><text x="150" y="326" text-anchor="start" fill="#52514e" font-size="8.6">Each isolate is one MALDI-TOF mass spectrum (6 000 intensity bins) with a laboratory S/R label. I and R are both treated as resistant, as in the DRIAMS reference code.</text></svg>